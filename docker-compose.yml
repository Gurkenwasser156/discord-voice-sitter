# Radio-Bot: sitzt 24/7 im Voice-Channel und spielt das AzuraCast-Radio.
# Konfiguration in bots/radio.env anlegen (Vorlage: .env.example).
#
# Bricht der Stream ab, startet nur der Player neu – der Bot bleibt im Channel,
# der Uptime-Timer läuft weiter. Nur bei einem Container-Neustart (Update)
# verlässt er kurz den Channel. Soll der Timer auch das überleben, zusätzlich
# einen normalen Sitter-Bot (main-Branch, eigenes Token) in den Channel setzen.
#
# Auto-Update: Push auf radio-bot -> GitHub Actions baut :radio -> watchtower
# merkt das neue Image (Check alle 5 Min), zieht es und startet den Bot neu.
# Manuell sofort: docker compose pull radio && docker compose up -d radio

services:
  radio:
    image: ghcr.io/gurkenwasser156/discord-voice-sitter:radio
    build: .
    restart: always
    env_file: bots/radio.env
#    labels:
#      - com.centurylinklabs.watchtower.enable=true   # nur dieser Container wird auto-geupdatet
    volumes:
      - radio-data:/app/data   # Favoriten + YouTube-Logins, überlebt Updates
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  radio-data:
